workflows:
  usadl-android-apk:
    name: US AutoDarts League Standalone Android APK
    instance_type: mac_mini_m2
    max_build_duration: 120
    environment:
      node: 22.14.0
      java: 17
      vars:
        EXPO_NO_TELEMETRY: "1"
        NODE_ENV: "production"
    scripts:
      - name: Install npm dependencies
        script: |
          npm install

      - name: Generate Android project with Expo
        script: |
          npx expo prebuild --platform android --clean --no-install

      - name: Configure Android SDK
        script: |
          echo "sdk.dir=$ANDROID_SDK_ROOT" > "$CM_BUILD_DIR/android/local.properties"

      - name: Build standalone release APK
        script: |
          cd android
          chmod +x gradlew
          ./gradlew app:assembleRelease --no-daemon

      - name: Verify JavaScript bundle is packaged
        script: |
          APK_PATH=$(find android/app/build/outputs/apk/release -name "*.apk" | head -n 1)
          if [ -z "$APK_PATH" ]; then
            echo "ERROR: Release APK was not created."
            exit 1
          fi
          echo "Release APK: $APK_PATH"
          unzip -l "$APK_PATH" | grep -q "assets/index.android.bundle" || {
            echo "ERROR: index.android.bundle is missing from the APK."
            exit 1
          }
          echo "Standalone JavaScript bundle verified inside APK."

    artifacts:
      - android/app/build/outputs/apk/release/*.apk
      - android/app/build/outputs/logs/*.txt
